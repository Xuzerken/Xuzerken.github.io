<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" font-family="Georgia, 'Times New Roman', 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif">
  <rect width="780" height="350" fill="#ffffff"/>

  <!-- ============================================================
       「难度地貌」示意图（difficulty landscape）
       概念出处：陶哲轩 2026-09-08 mathstodon 四帖（第 2 帖讲地貌）
       https://mathstodon.xyz/@tao/117237321472650215

       ⚠️ 这是**示意**，不是数据：纵轴是"解决该问题的难度"，峰谷起伏只是
       "地貌"这个隐喻的形状，不对应任何真实测量。图注与页面备注都保持这个口径。
       ============================================================ -->

  <!-- 三档难度的底色带（先画，作为背景） -->
  <rect x="52" y="34" width="584" height="78" fill="#f7f4ef"/>
  <rect x="52" y="112" width="584" height="102" fill="#f0ece5"/>
  <rect x="52" y="214" width="584" height="76" fill="#f7f4ef"/>

  <!-- 纵轴：难度 -->
  <line x1="52" y1="34" x2="52" y2="290" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="52,24 47,36 57,36" fill="#1a1a1a"/>
  <text x="26" y="162" text-anchor="middle" font-size="15" fill="#6b6b6b" transform="rotate(-90 26 162)">难度</text>

  <!-- 横轴：问题空间 -->
  <line x1="52" y1="290" x2="646" y2="290" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="656,290 644,285 644,295" fill="#1a1a1a"/>
  <text x="349" y="318" text-anchor="middle" font-size="15" fill="#6b6b6b">学科里的问题</text>

  <!-- 右侧的三档标签（独占一列，不与曲线相碰） -->
  <g font-size="15" fill="#6b6b6b">
    <text x="668" y="78">（还）不可解</text>
    <text x="668" y="167">费劲可解</text>
    <text x="668" y="256">已知方法极易解</text>
  </g>

  <!-- 原本的地貌（虚线灰）：峰高谷深，几何清晰 -->
  <path d="M 60 290 L 122 196 L 166 228 L 240 128 L 300 182 L 376 96 L 440 206 L 508 160 L 576 244 L 630 190"
        fill="none" stroke="#9a948a" stroke-width="2.2" stroke-dasharray="8 5"/>

  <!-- 被工具摊平之后的地貌（实线赭红）：起伏被压到同一条带里 -->
  <path d="M 60 290 L 122 246 L 166 258 L 240 224 L 300 240 L 376 212 L 440 250 L 508 232 L 576 264 L 630 248"
        fill="none" stroke="#a5182f" stroke-width="2.6"/>

  <!-- 摊平的箭头：从一个峰指到同一位置摊平后的点 -->
  <line x1="376" y1="102" x2="376" y2="206" stroke="#a5182f" stroke-width="1.4" stroke-dasharray="4 4"/>
  <polygon points="376,212 371,200 381,200" fill="#a5182f"/>

  <!-- 图例（放在绘图区左上，横排） -->
  <g font-size="14" fill="#6b6b6b">
    <line x1="70" y1="52" x2="104" y2="52" stroke="#9a948a" stroke-width="2.2" stroke-dasharray="8 5"/>
    <text x="112" y="57">原本的难度地貌</text>
    <line x1="270" y1="52" x2="304" y2="52" stroke="#a5182f" stroke-width="2.6"/>
    <text x="312" y="57">工具进步之后：被摊平</text>
  </g>

  <!-- 出处 -->
  <text x="52" y="342" font-size="12" fill="#b9b3a9" font-style="italic">示意图（非数据）：difficulty landscape，陶哲轩 2026-09-08</text>
</svg>
