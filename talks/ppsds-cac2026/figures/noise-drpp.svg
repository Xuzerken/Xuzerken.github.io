<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="nd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d8a"/>
    </marker>
  </defs>

  <!-- table plane -->
  <path d="M 70 215 L 300 150 L 500 215 L 270 285 Z" fill="#3f6b4f" opacity="0.14" stroke="#3f6b4f" stroke-width="2"/>
  <path d="M 70 215 L 270 285" stroke="#3f6b4f" stroke-width="1" opacity="0.35"/>
  <path d="M 300 150 L 500 215" stroke="#3f6b4f" stroke-width="1" opacity="0.35"/>

  <!-- nominal next state -->
  <circle cx="245" cy="213" r="7" fill="#c98b3a"/>
  <text x="245" y="325" font-size="16" fill="#6b6b6b" text-anchor="middle">nominal next state</text>

  <!-- mean noise arrow -->
  <line x1="245" y1="213" x2="330" y2="195" stroke="#2f5d8a" stroke-width="3" marker-end="url(#nd-arrow)"/>
  <text x="292" y="188" font-size="18" fill="#2f5d8a" font-weight="700">μ̄</text>

  <!-- covariance ellipse -->
  <ellipse cx="338" cy="194" rx="78" ry="48" fill="#c5a572" opacity="0.28" stroke="#a8874f" stroke-width="2.4"/>
  <g fill="#a8874f" opacity="0.45">
    <circle cx="310" cy="180" r="3"/><circle cx="330" cy="205" r="3"/><circle cx="352" cy="178" r="3"/>
    <circle cx="365" cy="200" r="3"/><circle cx="345" cy="214" r="3"/><circle cx="322" cy="198" r="3"/>
  </g>
  <text x="338" y="262" font-size="17" fill="#a8874f" font-weight="700" text-anchor="middle">γ₂ Σ̄</text>

  <text x="30" y="45" font-size="20" font-weight="700" fill="#2d1b1e">trust the dynamics f</text>
  <text x="30" y="70" font-size="16" fill="#4a4a4a">only the noise cloud is unknown</text>
</svg>
